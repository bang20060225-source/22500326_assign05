<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

        <script>
        function add() {
            const num1 = document.querySelector("#num1").value;
            const num2 = document.querySelector("#num2").value;
            const result = Number(num1) + Number(num2);

            document.querySelector("#result").value = result;
        }

        function clickMe() {
            const btn = document.querySelector("#clickBtn")
            alert('버튼이 클릭되었다.');
            btn.innerHTML = '<h1>clicked!</h1>'
        }

        window.addEventListener("load",function(){
                const clickBtn2 = document.querySelector("#clickBtn2");
                clickBtn2.addEventListener("click",function(event){
                clickBtn2.innerHTML  = "<h1>버튼</h1>"; 
    });

        });
    </script>
</head>
<body>

    <!-- 클릭버튼 -->
    <h3>Interner JS</h3>
    <button id="clickbtn" onelick="clickMe()">Cilck Me</button>


    <!-- 클릭버튼 -->
    <h3>Inine JS</h3>
    <div id="clickbtn" onelick="clickMe()">Cilck Me</div>


    <!-- 계산기 -->
    <h1>덧셈계산기</h1>
    <input type="text" id="num1" size="4">
    <input type="text" id="num2" size="4">
    
    <button id="addBtn" onclick="add()">+</button>
    
    <input id="result" readonly>

</body>
</html>

<script>
    const clickBtn2 = document.querySelector("#clickBtn2");
